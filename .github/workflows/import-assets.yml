name: Inspect master asset hashes

on:
  push:
    paths:
      - '.github/workflows/import-assets.yml'

permissions:
  contents: write

jobs:
  inspect-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download candidate assets
        run: |
          mkdir -p assets
          base='https://solid-drip-mtc9k36.shipstatic.com/assets'
          for f in drop closeup living product workshop; do curl -fsSL "$base/$f.webp" -o "assets/$f.webp"; done
      - name: Print SHA-256
        run: sha256sum assets/*.webp
