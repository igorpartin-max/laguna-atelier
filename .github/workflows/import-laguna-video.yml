name: Finalize LAGUNA droplet source

on:
  push:
    paths:
      - '.github/workflows/import-laguna-video.yml'

permissions:
  contents: write

jobs:
  finalize-drop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point hero video to repository asset
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<source src="https://d2jqrm6oza8nb6\.cloudfront\.net/datasets/[^"]+\.mp4\?_jwt=[^"]+" type="video/mp4">'
          replacement = '<source src="laguna-drop-live.mp4" type="video/mp4">'
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected one temporary droplet source, found {n}')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit finalized hero source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use repository-hosted live droplet in hero'
          git push
