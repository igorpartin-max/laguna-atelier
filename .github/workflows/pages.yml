name: Publish LAGUNA ATELIER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test and prepare public site
        run: npm test && npm run build

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

